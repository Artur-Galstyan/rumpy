[[exercises]]
name = "001_zeros"
dir = "01_creation"
skip_check_unsolved = true
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Shape:
Count the coordinate combinations, not the axes. A rectangular array needs one
stored value for each position. Preserve every axis, including axes of length one.

Hint 2 - Scalar versus empty:
An empty shape denotes one scalar. A shape containing a zero-length axis has no
positions. Your count must distinguish these two cases.

Hint 3 - Rust tools:
Iterator::product can combine axis lengths. Vec supports repetition of a value.
shape.to_vec() copies the shape so the result does not borrow the caller's input.

Hint 4 - Container:
Array::from_vec(flat_data, owned_shape) returns Result<Array, ShapeError>.
You may use expect with a useful message: this exercise restricts inputs to small,
valid shapes. Shape validation is scaffold code, not today's task.

Completed: your implementation now lives in src/creation/zeros.rs.
The old exercise tests the public API. A separate reference is in
solutions/01_creation/001_zeros.rs. The original hints remain above for review.
"""

[[exercises]]
name = "002_ones"
dir = "01_creation"
skip_check_unsolved = true
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Reuse:
Your completed rumpy::zeros already preserves the shape, allocates independent
storage, and distinguishes scalars from zero-length axes. Reuse that work.

Hint 2 - What changes:
The number and arrangement of positions stay the same. Only the stored values
change. Do not add values to an array that has a zero-length axis.

Hint 3 - Mutable access:
Bind the returned Array as mutable. Array::as_mut_slice gives access to its data
without changing its shape. A loop or a mutable-slice method can update values.

Hint 4 - Rust tools:
Slices have a fill method. Return the Array, not its borrowed slice.
The reference solution is solutions/01_creation/002_ones.rs; compare after an attempt.

Completed: your implementation now lives in src/creation/ones.rs.
The old exercise tests rumpy::ones. The original hints remain above for review.
"""

