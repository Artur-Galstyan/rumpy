format_version = 1
welcome_message = """
Welcome to rumpy: build a NumPy/SciPy-style library in Rust.
Start with lessons/001-zeros.md, then edit exercises/01_creation/zeros.rs.
Your implementation becomes rumpy::zeros. Press h for a progressive hint.
"""
final_message = """
You reached the end of the currently published exercises.
Commit and push your attempt to main. The separate daily check publishes the next
exercise after a new learner commit, even if your current tests are not all green.
No new learner commit means no new exercise. Run git pull --ff-only for updates.
