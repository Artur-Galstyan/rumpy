name = "009_mean"
dir = "03_reductions"
skip_check_unsolved = true
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Count:
Read lessons/009-mean.md. The denominator counts stored values, not axes.
A scalar has one value. An empty array has no mean and returns NaN.

Hint 2 - Order:
Complete the left-to-right sum from positive zero before the final division.
An online average or per-element division has different rounding behavior.

Hint 3 - Reuse:
Your rumpy::operations::sum now provides the required ordered reduction.
You may reuse that API or use the flat slice directly.
Do not import another exercise or copy a reference into src/.

Hint 4 - Rust tools:
Use size for the count, as f64 for conversion, and f64::NAN for empty input.
Keep the input shape and data bits unchanged. No allocation is needed.
The reference is solutions/03_reductions/009_mean.rs; compare after your attempt.
"""


[[exercises]]
name = "010_amax"
dir = "03_reductions"
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Empty versus scalar:
Read lessons/010-amax.md. The stored slice defines whether a maximum exists.
Shape [] contains one scalar. A zero-length axis contains no values.

Hint 2 - Initial value:
Zero cannot be the initial maximum for an all-negative input.
Consider a slice method that separates its first value from the rest.

Hint 3 - Equal values:
Compare strict and non-strict comparisons. Which retains the first equal value?
Positive and negative zero compare equal but have different bits.

Hint 4 - NaN policy:
A comparison alone cannot detect NaN. Any NaN must produce NaN, even after infinity.
f64::max ignores a single NaN, so it does not express this contract directly.
The reference is solutions/03_reductions/010_amax.rs; compare after your attempt.
"""
