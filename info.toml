name = "006_reshape"
dir = "02_shape"
skip_check_unsolved = true
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Values:
Read lessons/006-reshape.md. Reshape changes the axes, not the flat value order.
It is not transpose. This exercise always returns independent owned storage.

Hint 2 - Ownership:
The function borrows both inputs. Consider how a slice can become an owned Vec.
An output with the same shape still must not share mutable data with the input.

Hint 3 - Validation:
An empty shape requires one value. A zero-length axis requires none.
Inspect Array::from_vec and ShapeError before you duplicate their validation logic.

Hint 4 - Errors:
Keep validation errors in the Result. Do not turn an incompatible shape into a panic.
Copy floating-point values directly rather than recalculate them.
The reference is solutions/02_shape/006_reshape.rs; compare after your attempt.

Your preserved tests now call rumpy::reshape. The stride rollback resolves the
empty-shape regression. All 13 contract tests pass.
The runner also needs its historical // TODO comment.
"""

[[exercises]]
name = "007_transpose"
dir = "02_shape"
skip_check_unsolved = true
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Coordinates:
Read lessons/007-transpose.md. Each input column becomes an output row.
A shape swap alone does not transpose the flat values.

Hint 2 - Validation:
Check the input rank before an empty-array shortcut. A vector is not a matrix.
An empty matrix needs no value traversal, even when its other dimension is huge.

Hint 3 - Row-major order:
Each input row contains shape()[1] consecutive values. Locate one input coordinate
before you choose the order of traversal for the output rows.

Hint 4 - Ownership:
Use a new Vec and an owned swapped shape. Copy values without arithmetic so that
NaN payloads and signed zeros survive. Array::from_vec validates the final storage.
The reference is solutions/02_shape/007_transpose.rs; compare after your attempt.
"""


[[exercises]]
name = "008_sum"
dir = "03_reductions"
skip_check_unsolved = true
test = true
strict_clippy = false
hint = """
Read only as far as you need.

Hint 1 - Reduction:
Read lessons/008-sum.md. The output is one f64, not a new Array.
All ranks use the same flat storage. No shape product is necessary.

Hint 2 - Initial value:
The accumulator starts at positive zero before the first addition.
An empty array and a scalar negative zero both exercise this rule.

Hint 3 - Order:
Visit values in their stored left-to-right order. Floating-point addition can
change its result if you regroup values. Do not sort or use a pairwise reduction.

Hint 4 - Rust tools:
Array::as_slice gives borrowed values. A loop or a sequential fold can retain
an accumulator without allocating a result buffer. Leave the input unchanged.
The reference is solutions/03_reductions/008_sum.rs; compare after your attempt.
"""

