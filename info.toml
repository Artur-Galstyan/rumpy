Hint 1 - Shape:
Read lessons/005-eye.md. Both dimensions remain in the output shape.
A square and a rectangle follow the same main-diagonal rule.

Hint 2 - Reuse:
Your public zeros helper can create the initial two-axis matrix.
Only the main-diagonal values differ from that starting array.

Hint 3 - Positions:
The flat storage contains one row after another. Each row has cols values.
Use the row-major position example in the lesson to locate a chosen coordinate.

Hint 4 - Bounds:
A main-diagonal position requires both a valid row and a valid column.
Check what happens when either dimension is zero. Mutable-slice access preserves shape.
The reference is solutions/01_creation/005_eye.rs; compare after your attempt.

